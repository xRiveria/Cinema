name: Daily cinema scrape

# Runs the scraper once a day and commits the fresh JSON back to the repo.
# The Expo app can then fetch `https://raw.githubusercontent.com/<USER>/<REPO>/main/cinema_dashboard_FULL.json`
# (or the jsDelivr mirror) as its data source — no PC required.

on:
  schedule:
    # Daily at 22:00 UTC = 06:00 Singapore time (UTC+8).
    # Change this with care — cron uses UTC.
    - cron: '0 22 * * *'
  workflow_dispatch:        # also lets you trigger manually from the Actions tab
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'manual'

permissions:
  contents: write           # required so the workflow can commit the JSON

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          # cloudscraper sometimes needs a real-looking UA — overrideable here.
          USER_AGENT: 'Mozilla/5.0 (X11; Linux x86_64; rv:125.0) Gecko/20100101 Firefox/125.0'
        run: |
          python cinema_app.py
          ls -lh cinema_dashboard_FULL.json

      # Pushes ONLY the JSON to a separate public repo so the code repo
      # can stay private. Configure these once:
      #   • Create a public repo (e.g. xRiveria/cinema-data)
      #   • Settings → Secrets → Actions → New repository secret:
      #       DATA_REPO_TOKEN  = fine-grained PAT with Contents: read/write on cinema-data
      #       DATA_REPO        = "xRiveria/cinema-data"
      #       DATA_REPO_BRANCH = "main"   (or whatever the default branch is)
      - name: Publish JSON to public data repo
        env:
          DATA_REPO: ${{ vars.DATA_REPO || secrets.DATA_REPO }}
          DATA_REPO_BRANCH: ${{ vars.DATA_REPO_BRANCH || 'main' }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO" ] || [ -z "$DATA_REPO_TOKEN" ]; then
            echo "DATA_REPO / DATA_REPO_TOKEN not set — falling back to in-repo commit."
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cinema_dashboard_FULL.json
            if git diff --staged --quiet; then
              echo "No changes — skipping commit."
            else
              STAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
              git commit -m "chore(data): daily scrape ${STAMP}"
              git push
            fi
            exit 0
          fi

          STAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          TMP=$(mktemp -d)
          git clone --depth=1 \
            "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" \
            --branch "${DATA_REPO_BRANCH}" \
            "${TMP}" 2>/dev/null || git clone --depth=1 \
            "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" "${TMP}"

          cp cinema_dashboard_FULL.json "${TMP}/cinema_dashboard_FULL.json"
          cd "${TMP}"
          git checkout -B "${DATA_REPO_BRANCH}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cinema_dashboard_FULL.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "data: daily scrape ${STAMP}"
            git push origin "${DATA_REPO_BRANCH}"
          fi
